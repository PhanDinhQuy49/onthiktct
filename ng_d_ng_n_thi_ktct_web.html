      { id: 3, title: "Chương 3: Giá trị thặng dư (Đang chờ nạp...)", summary: [], questions: [] },
      { id: 4, title: "Chương 4: Cạnh tranh và Độc quyền (Đang chờ nạp...)", summary: [], questions: [] },
      { id: 5, title: "Chương 5: KTTT định hướng XHCN (Đang chờ nạp...)", summary: [], questions: [] },
      { id: 6, title: "Chương 6: CNH, HĐH và Hội nhập (Đang chờ nạp...)", summary: [], questions: [] }
    ];

    const shuffleArray = (array) => [...array].sort(() => Math.random() - 0.5);

    const determineDifficultyConfig = (goal) => {
      switch(goal) {
        case 'Pass': return { total: 10, nb: 6, h: 4, vd: 0 };
        case 'C': case 'C+': return { total: 15, nb: 7, h: 5, vd: 3 };
        case 'B': case 'B+': return { total: 20, nb: 8, h: 7, vd: 5 };
        case 'A': return { total: 25, nb: 10, h: 8, vd: 7 };
        case 'A+': return { total: 30, nb: 10, h: 10, vd: 10 };
        default: return { total: 10, nb: 5, h: 5, vd: 0 };
      }
    };

    const generateRoadmap = (timeframe, goal) => {
      const roadmap = [];
      const chaptersToDistribute = CHAPTERS_DATA.filter(ch => ch.questions.length > 0);
      
      for (let i = 1; i <= timeframe; i++) {
        const chapterIndex = (i - 1) % chaptersToDistribute.length;
        const chapter = chaptersToDistribute[chapterIndex];
        if(!chapter) break;

        const config = determineDifficultyConfig(goal);
        const nbQs = chapter.questions.filter(q => q.type === 'nhan_biet');
        const hQs = chapter.questions.filter(q => q.type === 'hieu');
        const vdQs = chapter.questions.filter(q => q.type === 'van_dung');

        const selectedQs = [
          ...shuffleArray(nbQs).slice(0, config.nb),
          ...shuffleArray(hQs).slice(0, config.h),
          ...shuffleArray(vdQs).slice(0, config.vd)
        ];

        roadmap.push({
          day: i,
          chapterId: chapter.id,
          title: `Ngày ${i}: ${chapter.title.split(':')[0]}`,
          summary: chapter.summary,
          status: i === 1 ? 'open' : 'locked',
          questions: shuffleArray(selectedQs),
          estimatedTime: Math.round(selectedQs.length * 1.5)
        });
      }
      return roadmap;
    };

    function App() {
      const [appState, setAppState] = useState('onboarding_time'); 
      const [timeframe, setTimeframe] = useState(null);
      const [customDays, setCustomDays] = useState('');
      const [goal, setGoal] = useState(null);
      const [roadmap, setRoadmap] = useState([]);
      const [currentDayIndex, setCurrentDayIndex] = useState(0);
      
      // Game stats
      const [xp, setXp] = useState(0);
      const [streak, setStreak] = useState(0);
      const [mistakes, setMistakes] = useState([]);
      
      // Quiz stats
      const [quizContext, setQuizContext] = useState({ type: 'normal' });
      const [quizQuestions, setQuizQuestions] = useState([]);
      const [qIndex, setQIndex] = useState(0);
      const [selectedOpt, setSelectedOpt] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [dayStats, setDayStats] = useState({ correct: 0, wrong: 0, timeStart: 0, timeEnd: 0, mistakes: [] });

      const handleGenerateRoadmap = (selectedGoal) => {
        setGoal(selectedGoal);
        const days = timeframe || parseInt(customDays) || 7;
        const generated = generateRoadmap(days, selectedGoal);
        setRoadmap(generated);
        setAppState('roadmap');
      };

      const startDay = (index) => {
        setCurrentDayIndex(index);
        setAppState('day_summary');
      };

      const startQuiz = (type = 'normal') => {
        setQuizContext({ type });
        if (type === 'normal') {
          setQuizQuestions(roadmap[currentDayIndex].questions);
        } else if (type === 'retry_day') {
          setQuizQuestions(dayStats.mistakes);
        } else if (type === 'retry_all') {
          setQuizQuestions(mistakes);
        }
        
        setQIndex(0);
        setSelectedOpt(null);
        setIsAnswered(false);
        setDayStats({ correct: 0, wrong: 0, timeStart: Date.now(), timeEnd: 0, mistakes: [] });
        setAppState('quiz');
      };

      const handleAnswer = (optIndex) => {
        if (isAnswered) return;
        setSelectedOpt(optIndex);
        setIsAnswered(true);

        const currentQ = quizQuestions[qIndex];
        const isCorrect = optIndex === currentQ.correct;

        if (isCorrect) {
          setXp(prev => prev + (quizContext.type === 'normal' ? 10 : 5));
          setDayStats(prev => ({ ...prev, correct: prev.correct + 1 }));
          
          if (quizContext.type === 'retry_all' || quizContext.type === 'retry_day') {
            setMistakes(prev => prev.filter(m => m.id !== currentQ.id));
          }
        } else {
          setDayStats(prev => ({ ...prev, wrong: prev.wrong + 1, mistakes: [...prev.mistakes, currentQ] }));
          if (!mistakes.find(m => m.id === currentQ.id)) {
            setMistakes(prev => [...prev, currentQ]);
          }
        }
      };

      const handleNextQuestion = () => {
        if (qIndex < quizQuestions.length - 1) {
          setQIndex(qIndex + 1);
          setSelectedOpt(null);
          setIsAnswered(false);
        } else {
          setDayStats(prev => ({ ...prev, timeEnd: Date.now() }));
          if (quizContext.type === 'normal') {
            setXp(prev => prev + 50);
            setStreak(prev => prev + 1);
            
            const newRoadmap = [...roadmap];
            newRoadmap[currentDayIndex].status = 'done';
            if (currentDayIndex + 1 < newRoadmap.length) {
              newRoadmap[currentDayIndex + 1].status = 'open';
            }
            setRoadmap(newRoadmap);
          }
          setAppState('day_complete');
        }
      };

      const goHome = () => {
        if (appState === 'quiz') {
          const confirmExit = window.confirm("Bạn đang làm dở quiz, nếu thoát bây giờ kết quả của vòng này sẽ không được lưu. Bạn có chắc không?");
          if (!confirmExit) return;
        }
        setAppState('roadmap');
      };

      const TopBar = () => (

          </div>
        </div>
      );

      const renderOnboardingTime = () => (
        <div className="min-h-screen flex flex-col items-center justify-center p-4 animate-fade-in">
          <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full text-center relative border border-pink-100">

                />

                  Tiếp tục
                </button>
              </div>
            </div>
          </div>
        </div>
      );

      const renderOnboardingGoal = () => (
        <div className="min-h-screen flex flex-col items-center justify-center p-4 animate-fade-in">
          <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-pink-100">
            <button onClick={() => setAppState('onboarding_time')} className="text-slate-400 hover:text-pink-500 mb-3 text-xs font-bold flex items-center gap-1 transition">
              ← Quay lại
            </button>
            <h1 className="text-2xl font-extrabold text-slate-800 mb-1">Mục tiêu điểm số</h1>
            <p className="text-slate-500 mb-6 text-xs leading-relaxed">
              Thuật toán Adaptive Difficulty sẽ tự căn chỉnh tỷ lệ câu Nhận biết, Hiểu và Vận dụng phù hợp nhất.
            </p>
            
            <div className="flex flex-col gap-2.5">
              {[
                { g: 'Pass', desc: 'Qua môn an toàn (~10 câu/ngày)' },
                { g: 'C+', desc: 'Mục tiêu Khá (~15 câu/ngày)' },
                { g: 'B+', desc: 'Mục tiêu Giỏi (~20 câu/ngày)' },
                { g: 'A', desc: 'Mục tiêu Xuất sắc (~25 câu/ngày)' },
                { g: 'A+', desc: 'Thủ khoa toàn năng (Đủ 30 câu/ngày)' }
              ].map(item => (
                <button key={item.g} onClick={() => handleGenerateRoadmap(item.g)}
                  className="p-3.5 rounded-2xl border-2 border-pink-100 bg-white hover:border-pink-400 hover:bg-pink-50/50 text-left flex justify-between items-center transition group">
                  <span className="font-extrabold text-slate-800 group-hover:text-pink-600">Điểm {item.g}</span>
                  <span className="text-xs text-slate-400 font-medium">{item.desc}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      );

      const renderRoadmap = () => {
        const totalDone = roadmap.filter(d => d.status === 'done').length;
        const progress = Math.round((totalDone / roadmap.length) * 100) || 0;

        return (
          <div className="min-h-screen flex flex-col animate-fade-in">
            <TopBar />
            <div className="flex-1 max-w-2xl w-full mx-auto p-4 py-6">
              
              {/* Mistake Notebook Card */}
              <div onClick={() => mistakes.length > 0 && setAppState('mistake_notebook')}

                    <h2 className="text-lg font-bold flex items-center gap-2">📓 Sổ tay câu sai</h2>
                    <p className="text-pink-100 text-xs mt-1">
                      {mistakes.length > 0 ? `Đang có ${mistakes.length} câu cần khắc phục để lấy lại điểm.` : 'Chưa có câu sai nào! Phong độ rất tuyệt.'}

                  </div>
                  {mistakes.length > 0 && (
                    <button className="px-3.5 py-1.5 bg-white text-pink-600 text-xs font-extrabold rounded-xl shadow-sm">
                      Luyện ngay

                  )}

              </div>

              {/* Roadmap Progress Overview */}
              <div className="bg-white p-5 rounded-3xl border border-pink-100 shadow-sm mb-6">
                <div className="flex justify-between items-center mb-2">
                  <span className="font-bold text-sm text-slate-700">Tiến độ chinh phục</span>
                  <span className="text-pink-600 font-extrabold text-sm">{progress}%</span>
                </div>
                <div className="h-3 w-full bg-pink-100 rounded-full overflow-hidden">
                  <div className="h-full bg-pink-500 transition-all duration-700 rounded-full" style={{ width: `${progress}%` }}></div>
                </div>
              </div>

              {/* Roadmap Days */}
              <div className="space-y-3.5">
                {roadmap.map((day, idx) => (
                  <div key={idx} className="bg-white p-4 rounded-3xl border border-pink-100 shadow-sm flex items-center justify-between gap-4">
                    <div className="flex items-center gap-3">
                      <div className={`w-10 h-10 rounded-2xl flex items-center justify-center font-bold text-sm shrink-0
                        ${day.status === 'done' ? 'bg-emerald-500 text-white' : 
                          day.status === 'open' ? 'bg-pink-500 text-white shadow-md shadow-pink-200' : 'bg-slate-100 text-slate-400'}`}>
                        {day.status === 'done' ? '✓' : idx + 1}
                      </div>
                      <div>
                        <h3 className="font-bold text-sm text-slate-800">{day.title}</h3>
                        <p className="text-xs text-slate-400 mt-0.5">{day.questions.length} câu • ~{day.estimatedTime} phút</p>
                      </div>
                    </div>

                    <button 
                      onClick={() => day.status !== 'locked' && startDay(idx)}
                      disabled={day.status === 'locked'}
                      className={`px-4 py-2 rounded-xl text-xs font-bold transition shrink-0 ${
                        day.status === 'locked' ? 'bg-slate-100 text-slate-400 cursor-not-allowed' :
                        day.status === 'done' ? 'bg-pink-50 text-pink-600 hover:bg-pink-100' :
                        'bg-pink-500 text-white hover:bg-pink-600 shadow-md shadow-pink-200'
                      }`}>
                      {day.status === 'done' ? 'Làm lại' : day.status === 'open' ? 'Bắt đầu' : 'Khóa'}
                    </button>
                  </div>
                ))}
              </div>

            </div>
          </div>
        );
      };

      const renderDaySummary = () => {
        const day = roadmap[currentDayIndex];
        return (
          <div className="min-h-screen flex flex-col animate-fade-in">
            <TopBar />
            <div className="flex-1 max-w-xl w-full mx-auto p-4 py-6 flex flex-col">
              <div className="bg-white rounded-3xl shadow-sm border border-pink-100 p-6 flex-1 flex flex-col">
                <h1 className="text-xl font-extrabold text-slate-800 mb-4 pb-3 border-b border-pink-100">
                  Tóm tắt cốt lõi: {day.title}
                </h1>
                <div className="space-y-3 mb-6 flex-1">
                  {day.summary.map((point, i) => (
                    <div key={i} className="flex gap-3 text-sm text-slate-700 bg-pink-50/40 p-3 rounded-2xl border border-pink-100">
                      <span className="text-pink-500 font-bold shrink-0">🐰</span>
                      <span>{point}</span>
                    </div>
                  ))}
                </div>
                <button onClick={() => startQuiz('normal')}
                  className="w-full py-3.5 rounded-2xl bg-pink-500 text-white font-bold text-sm hover:bg-pink-600 transition shadow-lg shadow-pink-200 active:scale-95">
                  Bắt đầu làm Quiz ({day.questions.length} câu)
                </button>
              </div>
            </div>
          </div>
        );
      };

      const renderQuiz = () => {
        const q = quizQuestions[qIndex];
        return (
          <div className="min-h-screen flex flex-col bg-slate-50 animate-fade-in">
            <div className="p-4 bg-white border-b border-slate-100 flex justify-between items-center sticky top-0 z-20">
              <button onClick={goHome} className="text-slate-400 hover:text-slate-600 text-xs font-bold px-2 py-1">
                ✕ Thoát
              </button>
              <div className="flex items-center gap-3">
                <div className="w-28 h-2 bg-slate-100 rounded-full overflow-hidden">
                  <div className="h-full bg-pink-500 transition-all duration-300" style={{width: `${((qIndex + 1) / quizQuestions.length) * 100}%`}}></div>
                </div>
                <span className="text-xs font-extrabold text-slate-500">{qIndex + 1}/{quizQuestions.length}</span>
              </div>
            </div>

            <div className="flex-1 max-w-xl w-full mx-auto p-4 py-6 flex flex-col">
              <div className="mb-3">
                <span className={`text-[11px] font-extrabold px-2.5 py-1 rounded-full uppercase tracking-wider
                  ${q.type === 'nhan_biet' ? 'bg-emerald-100 text-emerald-700' : 
                    q.type === 'hieu' ? 'bg-sky-100 text-sky-700' : 'bg-amber-100 text-amber-700'}`}>
                  {q.type.replace('_', ' ')}
                </span>
              </div>
              
              <h2 className="text-base sm:text-lg font-bold text-slate-800 mb-6 leading-snug">{q.text}</h2>

              <div className="space-y-2.5 flex-1">
                {q.options.map((opt, i) => {
                  let btnClass = "w-full text-left p-4 rounded-2xl border-2 text-sm font-medium transition-all ";
                  if (!isAnswered) {
                    btnClass += "border-white bg-white hover:border-pink-300 hover:bg-pink-50/40 text-slate-700 shadow-sm";
                  } else {
                    if (i === q.correct) {
                      btnClass += "border-emerald-500 bg-emerald-50 text-emerald-800 font-semibold";
                    } else if (i === selectedOpt) {
                      btnClass += "border-rose-500 bg-rose-50 text-rose-800 font-semibold";
                    } else {
                      btnClass += "border-transparent bg-white/50 text-slate-400 opacity-60";
                    }
                  }

                  return (
                    <button key={i} disabled={isAnswered} onClick={() => handleAnswer(i)} className={btnClass}>
                      <span className="font-bold mr-2 text-pink-600">{['A', 'B', 'C', 'D'][i]}.</span> {opt}
                    </button>
                  );
                })}
              </div>

              {isAnswered && (
                <div className="mt-6 animate-fade-in-up">
                  <div className={`p-4 rounded-2xl ${selectedOpt === q.correct ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-rose-50 border border-rose-200 text-rose-900'}`}>
                    <h3 className="font-extrabold text-sm mb-1 flex items-center gap-1.5">
                      {selectedOpt === q.correct ? '🎉 Rất chính xác!' : '🥲 Chưa đúng rồi!'}
                    </h3>
                    <p className="text-xs leading-relaxed mb-2">{q.explanation}</p>
                    <p className="text-[11px] font-semibold opacity-70">📍 {q.ref}</p>
                  </div>
                  <button onClick={handleNextQuestion} className="w-full py-3.5 mt-3 bg-pink-500 text-white font-bold text-sm rounded-2xl shadow-lg shadow-pink-200 hover:bg-pink-600 transition active:scale-95">
                    {qIndex < quizQuestions.length - 1 ? 'Câu tiếp theo ➔' : 'Xem tổng kết vòng thi 🎉'}
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      };

      const renderQuestCompleted = () => {
        const accuracy = Math.round((dayStats.correct / quizQuestions.length) * 100) || 0;
        const timeSpent = Math.max(1, Math.round((dayStats.timeEnd - dayStats.timeStart) / 60000));

        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-4 animate-fade-in">
            <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full text-center border border-pink-100">
              <div className="text-5xl mb-3">🏆</div>
              <h1 className="text-2xl font-black text-slate-800 uppercase tracking-wide">Hoàn Thành!</h1>
              <p className="text-slate-500 text-xs mb-6 font-medium">Bạn đã nỗ lực rất xuất sắc.</p>
              
              <div className="grid grid-cols-2 gap-3 mb-6">
                <div className="bg-emerald-50 border border-emerald-100 p-3.5 rounded-2xl">
                  <div className="text-xl font-black text-emerald-600">{accuracy}%</div>
                  <div className="text-[10px] text-emerald-800 font-bold uppercase">Độ chính xác</div>
                </div>
                <div className="bg-sky-50 border border-sky-100 p-3.5 rounded-2xl">
                  <div className="text-xl font-black text-sky-600">{timeSpent}p</div>
                  <div className="text-[10px] text-sky-800 font-bold uppercase">Thời gian</div>
                </div>
                <div className="bg-amber-50 border border-amber-100 p-3.5 rounded-2xl">
                  <div className="text-xl font-black text-amber-600">+{dayStats.correct * 10 + (quizContext.type==='normal'?50:0)}</div>
                  <div className="text-[10px] text-amber-800 font-bold uppercase">XP Nhận được</div>
                </div>
                <div className="bg-rose-50 border border-rose-100 p-3.5 rounded-2xl">
                  <div className="text-xl font-black text-rose-600">{dayStats.wrong}</div>
                  <div className="text-[10px] text-rose-800 font-bold uppercase">Câu sai</div>
                </div>
              </div>

              <div className="space-y-2.5">
                {dayStats.wrong > 0 && (
                  <button onClick={() => startQuiz('retry_day')} className="w-full py-3 rounded-xl font-bold text-xs bg-rose-100 text-rose-600 hover:bg-rose-200 transition">
                    Luyện lại ngay {dayStats.wrong} câu sai
                  </button>
                )}
                {quizContext.type === 'normal' && currentDayIndex + 1 < roadmap.length && (
                  <button onClick={() => startDay(currentDayIndex + 1)} className="w-full py-3 rounded-xl font-bold text-xs bg-pink-500 text-white hover:bg-pink-600 shadow-md shadow-pink-200 transition">
                    Mở ngày tiếp theo 🚀
                  </button>
                )}
                <button onClick={goHome} className="w-full py-3 rounded-xl font-bold text-xs border border-slate-200 text-slate-600 hover:bg-slate-50 transition">
                  Quay về lộ trình
                </button>
              </div>
            </div>
          </div>
        );
      };

      const renderMistakeNotebook = () => (
        <div className="min-h-screen flex flex-col animate-fade-in">
          <TopBar />
          <div className="flex-1 max-w-xl w-full mx-auto p-4 py-8 flex flex-col items-center justify-center text-center">
            <div className="bg-white rounded-3xl border border-pink-100 shadow-sm p-8 w-full">
              <div className="text-5xl mb-4">📓</div>
              <h1 className="text-2xl font-bold text-slate-800 mb-2">Sổ tay câu sai</h1>
              <p className="text-slate-500 text-xs mb-6 leading-relaxed">
                Bạn đang có <b>{mistakes.length}</b> câu hỏi cần chinh phục lại. Mỗi câu trả lời đúng sẽ được xóa khỏi sổ tay và thưởng +5 XP.
              </p>
              <button onClick={() => startQuiz('retry_all')}
                className="w-full py-3.5 rounded-2xl bg-pink-500 text-white font-bold text-sm shadow-lg shadow-pink-200 hover:bg-pink-600 transition">
                Bắt đầu luyện tập câu sai
              </button>
            </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen">
          {appState === 'onboarding_time' && renderOnboardingTime()}
          {appState === 'onboarding_goal' && renderOnboardingGoal()}
          {appState === 'roadmap' && renderRoadmap()}
          {appState === 'day_summary' && renderDaySummary()}
          {appState === 'quiz' && renderQuiz()}
          {appState === 'day_complete' && renderQuestCompleted()}
          {appState === 'mistake_notebook' && renderMistakeNotebook()}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
